name: Run macOS tests

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened ]
  workflow_dispatch:
  
jobs:
  test:
    name: Run all tests on macOS
    runs-on: macos-26

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Set Xcode version
        run: |
          # See https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
          sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        env:
          scheme: 'Clockwise'
        run: |
          # xcrun xctrace returns via stderr, not the expected stdout (see https://developer.apple.com/forums/thread/663959)
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild build-for-testing -scheme "$scheme"

      - name: Test
        env:
          scheme: 'Clockwise'
        run: |
          # xcrun xctrace returns via stderr, not the expected stdout (see https://developer.apple.com/forums/thread/663959)
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild test-without-building -scheme "$scheme" -resultBundlePath ./output/test-result.xcresult
    
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: test-result
          path: output/test-result.xcresult
